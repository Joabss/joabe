<section id="blog">
    <div class="container">  
    <div class="container">
        <div class="row">
            <div class="col-lg-10 col-lg-offset-1 col-md-10 col-md-offset-1">             


             {% for post in site.posts %}

            <section id="projects">
                <div class="project">
                    <h3>{{ post.title }}</h3>
                    <p class="lead">by {{ post.author }}</p>
                    <p><span class="fa fa-calendar"></span> Posted on {{ post.date | date: "%B %d, %Y" }}</p>
                    <p>
                        {{ post.excerpt }}
                    </p>

                    <a class="btn btn-primary" href="{{ post.github }}" target="_blank">GitHub  <span class="fa fa-github"></span></a>

                </div>

            </section>
            <hr>

            {% endfor %}
        </div>       
    </div>
</section>
